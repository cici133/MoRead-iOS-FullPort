name: MoRead
options:
  bundleIdPrefix: com.mozhi
  deploymentTarget:
    iOS: "17.0"
packages:
  OpenCC:
    url: https://github.com/ddddxxx/SwiftyOpenCC.git
    revision: 1d8105a0f7199c90af722bff62728050c858e777
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.12
targets:
  MoRead:
    type: application
    platform: iOS
    sources:
      - path: MoRead
    dependencies:
      - package: OpenCC
      - package: ZIPFoundation
      - sdk: libsqlite3.tbd
      - sdk: Network.framework
    info:
      path: MoRead/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mozhi.reader.ios
        PRODUCT_NAME: MoRead
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 78
        SWIFT_VERSION: 5.10
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
